name: Build images to GHCR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/ghcr-images.yaml"

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: adservice,             context: src/adservice }
          - { name: cartservice,           context: src/cartservice/src }
          - { name: checkoutservice,       context: src/checkoutservice }
          - { name: currencyservice,       context: src/currencyservice }
          - { name: emailservice,          context: src/emailservice }
          - { name: frontend,              context: src/frontend }
          - { name: loadgenerator,         context: src/loadgenerator }
          - { name: paymentservice,        context: src/paymentservice }
          - { name: productcatalogservice, context: src/productcatalogservice }
          - { name: recommendationservice, context: src/recommendationservice }
          - { name: shippingservice,       context: src/shippingservice }
    steps:
      - uses: actions/checkout@v4

      - name: Image name (lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
